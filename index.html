<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E2A33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ticket change</title>
<style>
  :root{
    --ink:#0E2A33;
    --panel:#143A47;
    --line:#1F4F5E;
    --paper:#EDF3F2;
    --muted:#79A0AA;
    --signal:#F2B441;
    --short:#FF7F6E;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    font-variant-numeric:tabular-nums;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    overflow:hidden;
  }
  #app{
    height:100vh;height:100dvh;
    padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);
    display:flex;flex-direction:column;gap:clamp(8px,1.6dvh,16px);
  }

  /* header */
  .bar{display:flex;align-items:center;justify-content:space-between}
  .bar p{font-size:14px;color:var(--muted);letter-spacing:.01em}
  .bar b{color:var(--paper);font-weight:600}
  .ghost{
    background:none;border:1px solid var(--line);color:var(--muted);
    width:38px;height:32px;border-radius:8px;font-size:15px;line-height:1;cursor:pointer;
  }
  .ghost:active{background:var(--panel);color:var(--paper)}

  h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:6px}

  /* grids */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button.key{
    border:1px solid var(--line);background:var(--panel);color:var(--paper);
    border-radius:var(--r);font-family:inherit;font-variant-numeric:tabular-nums;
    cursor:pointer;transition:transform .06s ease,background .12s ease;
  }
  button.key:active{transform:scale(.95)}
  .tickets{grid-template-columns:repeat(5,1fr)}
  .tickets button{height:clamp(46px,8.4dvh,70px);font-size:clamp(19px,3.2dvh,25px);font-weight:700}
  .tickets button[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#10242B}
  .tickets button.custom{grid-column:span 2;font-size:clamp(14px,2.3dvh,17px);font-weight:600;color:var(--muted)}
  .tickets button.custom[aria-pressed="true"]{color:#10242B;font-size:clamp(19px,3.2dvh,25px);font-weight:700}
  .cash button{height:clamp(42px,7.4dvh,62px);font-size:clamp(15px,2.5dvh,19px);font-weight:600}
  .cash button.undo{background:none;color:var(--muted);border-style:dashed;font-size:14px;font-weight:500}
  .cash button.undo:disabled{opacity:.35}
  button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  /* amount due */
  .due{
    display:flex;align-items:baseline;justify-content:space-between;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:clamp(8px,1.6dvh,14px) 2px;
  }
  .due span{font-size:13px;color:var(--muted)}
  .due b{font-size:clamp(30px,7dvh,50px);font-weight:700;letter-spacing:-.02em}
  .due.empty b{color:var(--muted);font-weight:500;font-size:clamp(17px,3dvh,21px);letter-spacing:0}

  .given{display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px 0;font-size:13px;color:var(--muted)}
  .given b{font-size:clamp(17px,3dvh,21px);color:var(--paper);font-weight:600}

  /* change stub */
  .stub{
    margin-top:auto;position:relative;background:var(--panel);
    border-radius:4px 4px var(--r) var(--r);
    padding:clamp(12px,2.4dvh,20px) 16px;text-align:center;
    border-top:2px dashed var(--ink);cursor:pointer;
  }
  .stub::before,.stub::after{
    content:"";position:absolute;top:-11px;width:18px;height:18px;
    border-radius:50%;background:var(--ink);
  }
  .stub::before{left:-9px}
  .stub::after{right:-9px}
  .stub small{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
  .stub strong{display:block;font-size:clamp(34px,8.5dvh,60px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
  .stub .coins{
    display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
    margin-top:clamp(8px,1.4dvh,12px);min-height:1em;
  }
  .stub .coins i{
    font-style:normal;font-size:clamp(16px,3dvh,22px);font-weight:700;
    color:var(--paper);background:var(--line);border-radius:8px;
    padding:clamp(5px,1dvh,9px) clamp(9px,1.6dvh,14px);
  }
  .stub .coins em{font-style:normal;font-size:14px;color:var(--muted);align-self:center}
  .stub.ready strong{color:var(--signal)}
  .stub.short strong{color:var(--short)}
  .stub.idle strong{font-size:clamp(17px,3dvh,21px);font-weight:500;color:var(--muted);letter-spacing:0}
  .stub.ready:active{background:var(--line)}
  /* number pad */
  .pad{
    position:fixed;inset:0;z-index:10;background:rgba(9,26,32,.82);
    display:flex;align-items:flex-end;justify-content:center;
    padding:16px 12px calc(env(safe-area-inset-bottom) + 16px);
  }
  .pad[hidden]{display:none}
  .padBox{width:100%;max-width:420px;background:var(--ink);border:1px solid var(--line);border-radius:18px;padding:14px}
  .padHead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .padHead span{font-size:13px;color:var(--muted)}
  .padHead button{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:4px 2px;cursor:pointer}
  .padOut{
    font-size:clamp(32px,7dvh,46px);font-weight:700;letter-spacing:-.02em;
    text-align:right;padding:0 6px clamp(8px,1.6dvh,14px);border-bottom:1px solid var(--line);margin-bottom:12px;
  }
  .padOut.zero{color:var(--muted)}
  .padGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .padGrid button{height:clamp(48px,7.6dvh,64px);font-size:clamp(20px,3.2dvh,25px);font-weight:600}
  .padGrid button.set{background:var(--signal);border-color:var(--signal);color:#10242B}
  .padGrid button.set:disabled{opacity:.35}
  @media (prefers-reduced-motion:reduce){button.key{transition:none}}
</style>
</head>
<body>
<div id="app">

  <div class="bar">
    <p><b>5,00 €</b> per ticket</p>
    <button class="ghost" id="fs" aria-label="Toggle fullscreen">⛶</button>
  </div>

  <div>
    <h2>Tickets</h2>
    <div class="grid tickets" id="tickets"></div>
  </div>

  <div class="due empty" id="due">
    <span id="dueNote">To pay</span>
    <b id="dueAmount">Choose the tickets</b>
  </div>

  <div>
    <h2>Cash received</h2>
    <div class="grid cash" id="cash"></div>
    <div class="given"><span>Given</span><b id="given">0,00 €</b></div>
  </div>

  <div class="stub idle" id="stub" role="button" tabindex="0">
    <small id="stubLabel">Change</small>
    <strong id="stubAmount">Waiting for cash</strong>
    <span class="coins" id="coins"></span>
  </div>

</div>

<div class="pad" id="pad" hidden>
  <div class="padBox">
    <div class="padHead">
      <span>How many tickets?</span>
      <button id="padCancel">Cancel</button>
    </div>
    <div class="padOut zero" id="padOut">0</div>
    <div class="padGrid" id="padGrid"></div>
  </div>
</div>

<script>
const PRICE = 500;                    // cents
const NOTES = [50,100,200,500,1000,2000,5000];
const CHANGE_SET = [5000,2000,1000,500,200,100,50,20,10,5];

let tickets = 0;
let isCustom = false;
let paid = [];

const $ = id => document.getElementById(id);
const fmt = c => (c/100).toFixed(2).replace('.', ',') + ' €';
const buzz = ms => navigator.vibrate && navigator.vibrate(ms);

/* build ticket keys 1-8 */
const tGrid = $('tickets');
const tKeys = [];
for (let n = 1; n <= 8; n++) {
  const b = document.createElement('button');
  b.className = 'key';
  b.textContent = n;
  b.setAttribute('aria-pressed', 'false');
  b.onclick = () => {
    tickets = (tickets === n && !isCustom) ? 0 : n;
    isCustom = false;
    buzz(10); render();
  };
  tKeys.push(b);
  tGrid.appendChild(b);
}
const customKey = document.createElement('button');
customKey.className = 'key custom';
customKey.textContent = 'More…';
customKey.setAttribute('aria-pressed', 'false');
customKey.onclick = () => { buzz(10); openPad(); };
tGrid.appendChild(customKey);

/* build cash keys + undo */
const cGrid = $('cash');
NOTES.forEach(v => {
  const b = document.createElement('button');
  b.className = 'key';
  b.textContent = fmt(v).replace(',00', '');
  b.onclick = () => { paid.push(v); buzz(10); render(); };
  cGrid.appendChild(b);
});
const undo = document.createElement('button');
undo.className = 'key undo';
undo.id = 'undo';
undo.textContent = 'Undo';
undo.onclick = () => { paid.pop(); buzz(10); render(); };
cGrid.appendChild(undo);

/* tap the stub to clear for the next customer */
$('stub').onclick = () => {
  if (tickets || paid.length) { tickets = 0; isCustom = false; paid = []; buzz(18); render(); }
};

/* number pad for a custom ticket count */
let entry = '';
const padGrid = $('padGrid');
const padOut = $('padOut');
const setKey = document.createElement('button');

['1','2','3','4','5','6','7','8','9','⌫','0','Set'].forEach(k => {
  const b = (k === 'Set') ? setKey : document.createElement('button');
  b.className = 'key' + (k === 'Set' ? ' set' : '');
  b.textContent = k;
  b.onclick = () => {
    buzz(10);
    if (k === '⌫') entry = entry.slice(0, -1);
    else if (k === 'Set') {
      const n = parseInt(entry || '0', 10);
      tickets = n; isCustom = n > 0;
      closePad(); render(); return;
    } else if (entry.length < 3) entry = (entry === '0' ? '' : entry) + k;
    drawPad();
  };
  padGrid.appendChild(b);
});

function drawPad() {
  padOut.textContent = entry || '0';
  padOut.classList.toggle('zero', !entry);
  setKey.disabled = !entry || entry === '0';
}
function openPad() { entry = isCustom ? String(tickets) : ''; drawPad(); $('pad').hidden = false; }
function closePad() { $('pad').hidden = true; }
$('padCancel').onclick = () => { buzz(10); closePad(); };
$('pad').onclick = e => { if (e.target === $('pad')) closePad(); };

function coinsFor(amount) {
  const parts = [];
  CHANGE_SET.forEach(d => {
    const n = Math.floor(amount / d);
    if (n) { parts.push('<i>' + n + ' × ' + fmt(d).replace(',00', '') + '</i>'); amount -= n * d; }
  });
  return parts.join('');
}

function render() {
  const due = tickets * PRICE;
  const given = paid.reduce((a, b) => a + b, 0);

  tKeys.forEach((b, i) => b.setAttribute('aria-pressed', !isCustom && i + 1 === tickets));
  customKey.setAttribute('aria-pressed', isCustom);
  customKey.textContent = isCustom ? tickets : 'More…';

  $('due').classList.toggle('empty', !tickets);
  $('dueNote').textContent = tickets ? tickets + ' × 5,00 €' : 'To pay';
  $('dueAmount').textContent = tickets ? fmt(due) : 'Choose the tickets';

  $('given').textContent = fmt(given);
  undo.disabled = !paid.length;

  const stub = $('stub');
  stub.className = 'stub';
  if (!tickets || !given) {
    stub.classList.add('idle');
    $('stubLabel').textContent = 'Change';
    $('stubAmount').textContent = !tickets ? 'Choose the tickets' : 'Waiting for cash';
    $('coins').innerHTML = '';
  } else if (given < due) {
    stub.classList.add('short');
    $('stubLabel').textContent = 'Still owed';
    $('stubAmount').textContent = fmt(due - given);
    $('coins').innerHTML = '';
  } else {
    stub.classList.add('ready');
    $('stubLabel').textContent = 'Change';
    $('stubAmount').textContent = fmt(given - due);
    $('coins').innerHTML = given === due
      ? '<em>Exact money — tap to start the next sale</em>'
      : coinsFor(given - due);
  }
}

/* keep the screen on */
let lock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !lock) {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
keepAwake();

/* fullscreen */
function toggleFullscreen() {
  const el = document.documentElement;
  const on = document.fullscreenElement || document.webkitFullscreenElement;
  if (!on) (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  else (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
}
$('fs').onclick = e => { e.stopPropagation(); toggleFullscreen(); };
document.addEventListener('pointerdown', function first() {
  keepAwake();
  toggleFullscreen();
  document.removeEventListener('pointerdown', first);
}, { once: true });

render();
</script>
</body>
</html>
